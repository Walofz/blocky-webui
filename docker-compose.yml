services:
  # ── Blocky DNS server ─────────────────────────────────────────────────────
  # host network: required so Blocky sees real client IPs (not Docker bridge IPs)
  # port 53 (DNS) and port 4000 (HTTP API) bind directly on the host
  blocky:
    image: spx01/blocky:latest
    container_name: blocky
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/app/config
    command: --config /app/config/config.generated.yaml
    # NOTE: Run `cd backend && npm run generate` once before first `docker compose up`
    # to create config.generated.yaml, otherwise Blocky will fail to start.

  # ── WebUI backend ─────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      CONFIG_DIR: /config
      # Reach Blocky's HTTP API across the host-network boundary.
      # extra_hosts below maps host.docker.internal → host-gateway on Linux.
      BLOCKY_URL: ${BLOCKY_URL:-http://host.docker.internal:4000}
      # Container to restart when config changes (Blocky has no reload API)
      BLOCKY_CONTAINER: blocky
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config
      # Needed so the backend can restart the blocky container to apply config
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── WebUI frontend ────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

