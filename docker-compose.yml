services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      CONFIG_DIR: /config
      BLOCKY_URL: ${BLOCKY_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
