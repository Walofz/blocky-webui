# custom.yaml — Managed by Blocky WebUI (do not edit by hand while the WebUI is running)
# This file is written atomically by the backend whenever you save changes in the UI.
# Version is incremented on each save so you can track config history.

version: 1

adsProfiles:
  - name: "ads-basic"
    type: "block"
    blocklists:
      - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      - "https://adaway.org/hosts.txt"

  - name: "ads-strict"
    type: "block"
    blocklists:
      - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      - "https://adaway.org/hosts.txt"
      - "https://raw.githubusercontent.com/nicehash/NiceHashQuickMiner/master/build/whitelist/whitelist.txt"

  - name: "allow-common"
    type: "allow"
    blocklists:
      - "https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt"

groups:
  - name: "default"
    adsProfiles:
      - "ads-basic"
    clients: []

  - name: "kids"
    adsProfiles:
      - "ads-strict"
      - "ads-basic"
    clients:
      - "192.168.1.50"
      - "192.168.1.51"

upstreams:
  - "tcp+udp:1.1.1.1"
  - "tcp+udp:8.8.8.8"

dnsRecords:
  - type: "A"
    domain: "router.local"
    address: "192.168.1.1"

  - type: "CNAME"
    domain: "nas.local"
    target: "fileserver.local"
