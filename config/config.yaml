# config.yaml — Static Blocky configuration (not managed by the WebUI)
# Edit this file manually and restart Blocky to apply changes.
# See: https://0xerr0r.github.io/blocky/configuration/

upstreams:
  groups:
    default:
      - 8.8.8.8
      - 1.1.1.1

blocking:
  denylists: {}  # populated from custom.yaml by your integration script
  clientGroupsBlock: {}
  blockType: nxDomain

customDNS:
  mapping: {}  # populated from custom.yaml by your integration script

queryLog:
  # CSV query log written into the shared ./config volume.
  # The WebUI backend tails these files to stream realtime logs.
  # Blocky (docker, host network) sees this dir as /app/config/logs,
  # the backend container sees it as /config/logs.
  type: csv
  target: /app/config/logs
  logRetentionDays: 7
  # Flush queued entries every 5s so the WebUI shows them near-realtime
  # (Blocky's default is 30s)
  flushInterval: 5s

ports:
  http: 4000

log:
  level: info
